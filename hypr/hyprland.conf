# Celeste rice — Hyprland
# Palette: base #0d0b1a · overlay #2a2350 · cobalt #4a6cf7 · violet #9a6bff · magenta #e05fd0

monitor = , preferred, auto, 1

$terminal = kitty
$mod = SUPER

exec-once = hyprpaper
exec-once = qs

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(4a6cf7ff) rgba(9a6bffff) rgba(e05fd0ff) 45deg
    col.inactive_border = rgba(2a2350cc)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.94

    blur {
        enabled = true
        size = 6
        passes = 3
        vibrancy = 0.2
    }

    shadow {
        enabled = true
        range = 20
        render_power = 3
        color = rgba(9a6bff44)
        color_inactive = rgba(0d0b1a88)
    }
}

animations {
    enabled = true
    bezier = snap, 0.05, 0.9, 0.1, 1.05
    bezier = smooth, 0.25, 1, 0.5, 1
    animation = windows, 1, 5, snap, popin 80%
    animation = windowsMove, 1, 4, snap
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, smooth
    animation = fade, 1, 5, smooth
    animation = layers, 1, 4, smooth, fade
    animation = workspaces, 1, 5, snap, slidefade 15%
}

dwindle {
    pseudotile = true
    preserve_split = true
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    background_color = rgb(0d0b1a)
}

# Blur Quickshell surfaces (bar, launcher, power menu, notifications)
layerrule = blur, ^(quickshell.*)$
layerrule = ignorezero, ^(quickshell.*)$

# --- Floating ---
# Floating windows get a magenta border so they read as lifted over the tiles
windowrule = bordercolor rgba(e05fd0ff), floating:1

# Small utility windows and dialogs float, centered
windowrule = float, class:^(pavucontrol|org.pulseaudio.pavucontrol|nm-connection-editor|blueman-manager|org.gnome.Calculator|xdg-desktop-portal-gtk)$
windowrule = size 900 600, class:^(pavucontrol|org.pulseaudio.pavucontrol|nm-connection-editor|blueman-manager)$
windowrule = float, title:^(Open File|Save As|Open Folder|File Upload)(.*)$
windowrule = center, floating:1

# Picture-in-Picture stays on every workspace
windowrule = float, title:^(Picture-in-Picture)$
windowrule = pin, title:^(Picture-in-Picture)$
windowrule = keepaspectratio, title:^(Picture-in-Picture)$
windowrule = size 480 270, title:^(Picture-in-Picture)$

# --- Binds ---
bind = $mod, Return, exec, $terminal
bind = $mod, Q, killactive
bind = $mod, Space, exec, qs ipc call launcher toggle
bind = $mod, Escape, exec, qs ipc call power toggle
bind = $mod, V, togglefloating
bind = $mod, V, centerwindow
bind = $mod, C, centerwindow
bind = $mod SHIFT, P, pin
bind = $mod, F, fullscreen
bind = $mod, P, pseudo
bind = $mod, J, togglesplit

bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Floating: move / resize with the keyboard (hold to repeat)
binde = $mod ALT, left, moveactive, -40 0
binde = $mod ALT, right, moveactive, 40 0
binde = $mod ALT, up, moveactive, 0 -40
binde = $mod ALT, down, moveactive, 0 40
binde = $mod CTRL, left, resizeactive, -40 0
binde = $mod CTRL, right, resizeactive, 40 0
binde = $mod CTRL, up, resizeactive, 0 -40
binde = $mod CTRL, down, resizeactive, 0 40

# Scratchpad: a hidden workspace that pops over everything
bind = $mod, S, togglespecialworkspace, magic
bind = $mod SHIFT, S, movetoworkspace, special:magic

bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9

bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
