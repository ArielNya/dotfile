# hyprpaper >= 0.8 block syntax
splash = false # hyprpaper draws a random Hyprland joke line over the wallpaper by default

wallpaper {
    monitor =
    path = ~/.config/wallpapers/celeste.jpg
    fit_mode = cover
}

# hyprpaper <= 0.7: delete the block above and use these instead
# preload = ~/.config/wallpapers/celeste.jpg
# wallpaper = , ~/.config/wallpapers/celeste.jpg
